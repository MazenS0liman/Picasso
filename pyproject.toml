[project]
name = "picasso"
version = "0.1.0"
description = ""
authors = [
    {name = "mazen",email = "mazzen.m.s0liman@gmail.com "}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets (>=5.0.1,<6.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "torchvision (>=0.29.0,<0.30.0)",
    "matplotlib (<3.11)",
    "transformers (>=5.18.0,<6.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "imageio (>=2.38.0,<3.0.0)",
    "tqdm (>=4.70.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]


[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
[tool.poetry.dependencies]
torch = {source = "pytorch"}
torchvision = {source = "pytorch"}
